{% extends "base.html" %}

{% block content %}
<div class="painel">
  <h1>Alterar status</h1>
  <p>Alterar o status de "{{ tarefa.titulo }}"?</p>
  <form method="post" class="acoes">
    {% csrf_token %}
    <button type="submit" class="botao">Sim, alterar</button>
    <a class="botao-pequeno" href="{% url 'detalhe_tarefa' tarefa.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
