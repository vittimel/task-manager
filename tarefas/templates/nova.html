{% extends "base.html" %}

{% block content %}
<div class="painel">
  <h1>Nova tarefa</h1>
  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="botao">Salvar</button>
  </form>
</div>
<p><a class="voltar" href="{% url 'lista_tarefas' %}">← Voltar para a lista</a></p>
{% endblock %}
